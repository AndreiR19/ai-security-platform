name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: pytest -v
      - run: bandit -r src/
      - run: pip-audit
      - run: pip-audit -r requirements-runtime.txt --require-hashes --disable-pip

  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install semgrep==1.185.0
      - run: semgrep scan --config p/python --error --metrics=off src/

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker run --rm -i hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d < Dockerfile
      - run: docker build -t aisoc:ci .
      - run: |
          docker run --rm \
            --read-only \
            --network none \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --memory 256m --memory-swap 256m \
            --cpus 1 --pids-limit 64 \
            -v "$(pwd)/data/samples:/data:ro" \
            aisoc:ci /data/auth.log --year 2026 > alerts.jsonl
          test "$(wc -l < alerts.jsonl)" -eq 4
      - run: docker save aisoc:ci -o image.tar
      - run: |
          docker run --rm \
            -v "$(pwd)/image.tar:/image.tar:ro" \
            aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb \
            image --input /image.tar \
            --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1
